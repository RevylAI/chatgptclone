project:
    id: a063849f-2bb7-4261-bd72-21edee158068
session:
    idle_timeout_seconds: 1800
    auth_bypass:
        launch_vars: [DEMO_AUTH_BYPASS, DEMO_SEED_DATA]
build:
    framework: ios
    profiles:
        development:
            ios:
                app_id: 3c0e0458-75a0-4a38-bd4c-152d25d756cb
                build_commands:
                    # Cloud previews target Revyl's ARM64 simulator. Keep local Xcode defaults.
                    - >-
                      xcodebuild -project ChatGPTDemo.xcodeproj -scheme 'ChatGPTDemo'
                      -configuration Debug -sdk iphonesimulator
                      -destination 'generic/platform=iOS Simulator' -derivedDataPath build
                      -showBuildTimingSummary ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
                      COMPILER_INDEX_STORE_ENABLE=NO
                output_path: build/Build/Products/Debug-iphonesimulator/*.app
pr_review:
    build:
        kind: revyl
        profile: development
    proof_of_changes:
        enabled: true
        harness:
            kind: revyl
