name: ChatGPTDemo
options:
  bundleIdPrefix: ai.revyl.demo
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) DEMO_MODE'
targets:
  ChatGPTDemo:
    type: application
    platform: iOS
    sources: [ChatGPTDemo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.revyl.demo.chatgpt
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ChatGPT Demo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
  ChatGPTDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ChatGPTDemoTests]
    dependencies:
      - target: ChatGPTDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ChatGPTDemo:
    build:
      targets:
        ChatGPTDemo: all
    test:
      targets: [ChatGPTDemoTests]
